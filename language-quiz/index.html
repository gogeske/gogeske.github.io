<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0}
:root{--h:36;--ink:#14110f}
html,body{height:100%}
body{font:600 1.125rem/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:hsl(var(--h) 88% 62%);transition:background .4s;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
main{min-height:100%;min-height:100dvh;max-width:44rem;margin:auto;padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:center;gap:1.25rem;text-align:center}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);touch-action:manipulation;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
h1{font-size:clamp(1.25rem,4.5vw,1.75rem);font-weight:800;min-height:1.3em}
#go{align-self:center;width:min(60vw,15rem);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
#go::before{content:"";border-style:solid;border-width:2.6rem 0 2.6rem 4.4rem;border-color:transparent transparent transparent var(--ink);margin-left:1rem}
#say{padding:1.25rem 1rem;font-size:clamp(1.6rem,6.5vw,3rem);font-weight:800;line-height:1.25;text-wrap:balance;min-height:3.4em}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
#opts button{min-height:4rem;padding:.6rem .4rem;font-size:clamp(1rem,4vw,1.35rem);hyphens:auto;overflow-wrap:anywhere}
#opts .y{background:#15803d;color:#fff}
#opts .n{background:#b91c1c;color:#fff;animation:s .3s}
#opts.done button:not(.y):not(.n){opacity:.45}
#score{font-size:1rem;min-height:1.3em;font-variant-numeric:tabular-nums}
@keyframes s{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-height:36rem){main{gap:.7rem}#say{padding:.7rem;font-size:clamp(1.3rem,5.5vw,2rem);min-height:0}#opts{gap:.6rem}#opts button{min-height:3rem}#go{width:min(45vw,45vh)}}
@media(max-height:30rem) and (orientation:landscape){main{max-width:none;display:grid;grid-template-columns:1fr 1fr;align-content:center;align-items:center}h1,#go,#score{grid-column:1/-1}#go{justify-self:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<h1 id="q" aria-live="polite">Which language is this?</h1>
<button id="go" aria-label="Play"></button>
<button id="say" hidden dir="auto"></button>
<div id="opts" hidden><button></button><button></button><button></button><button></button></div>
<p id="score" hidden></p>
</main>
<script>
(function(){
// code, English name (fallback), lookalike group, voice prefixes, phrase
var L=[
["fr","French",0,"fr","Bonjour ! Comment ça va aujourd’hui ?"],
["es","Spanish",0,"es-es,es","¡Hola! Buenos días, ¿cómo estás?"],
["pt","Portuguese",0,"pt-br,pt","Olá! Bom dia, tudo bem?"],
["it","Italian",0,"it","Ciao! Buongiorno, come stai?"],
["ro","Romanian",0,"ro","Bună! Bună dimineața, ce mai faci?"],
["en","English",1,"en-gb,en","Hello! Good morning, how are you?"],
["nl","Dutch",1,"nl","Hallo! Goedemorgen, hoe gaat het?"],
["sv","Swedish",1,"sv","Hej! God morgon, hur mår du?"],
["no","Norwegian",1,"nb,no","Hei! God morgen, hvordan har du det?"],
["da","Danish",1,"da","Hej! Godmorgen, hvordan har du det?"],
["ru","Russian",2,"ru","Привет! Доброе утро, как дела?"],
["uk","Ukrainian",2,"uk","Привіт! Доброго ранку, як справи?"],
["bg","Bulgarian",2,"bg","Здравей! Добро утро, как си?"],
["pl","Polish",2,"pl","Cześć! Dzień dobry, jak się masz?"],
["cs","Czech",2,"cs","Ahoj! Dobré ráno, jak se máš?"],
["hr","Croatian",2,"hr","Bok! Dobro jutro, kako si?"],
["ar","Arabic",3,"ar","مرحبا! صباح الخير، كيف حالك؟"],
["fa","Persian",3,"fa","سلام! صبح بخیر، حال شما چطور است؟"],
["ur","Urdu",3,"ur","السلام علیکم! آپ کیسے ہیں؟"],
["he","Hebrew",3,"he,iw","שלום! בוקר טוב, מה שלומך?"],
["hi","Hindi",4,"hi","नमस्ते! आप कैसे हैं?"],
["bn","Bengali",4,"bn","নমস্কার! আপনি কেমন আছেন?"],
["th","Thai",4,"th","สวัสดี! สบายดีไหม?"],
["ja","Japanese",5,"ja","こんにちは！お元気ですか？"],
["ko","Korean",5,"ko","안녕하세요! 잘 지내세요?"],
["zh","Chinese",5,"zh-cn,cmn,zh","你好！早上好，你好吗？"],
["yue","Cantonese",5,"zh-hk,yue","你好！早晨，你好嗎？"],
["vi","Vietnamese",5,"vi","Xin chào! Bạn có khỏe không?"],
["tr","Turkish",6,"tr","Merhaba! Günaydın, nasılsın?"],
["hu","Hungarian",6,"hu","Szia! Jó reggelt, hogy vagy?"],
["fi","Finnish",6,"fi","Hei! Hyvää huomenta, mitä kuuluu?"],
["el","Greek",6,"el","Γεια σου! Καλημέρα, τι κάνεις;"],
["id","Indonesian",6,"id","Halo! Selamat pagi, apa kabar?"],
["sw","Swahili",6,"sw","Jambo! Habari za asubuhi?"]
];
var de=/^de/i.test(navigator.language||""),
T=de?["Welche Sprache ist das?","Das war ",". Richtig!",".","Serie ","Rekord "]:["Which language is this?","That was ",". Correct!",".","Streak ","Best "],
$=function(i){return document.getElementById(i)},
q=$("q"),go=$("go"),say=$("say"),opts=$("opts"),score=$("score"),B=opts.children,
S=window.speechSynthesis,dn,bag=[],cur,choices,streak=0,best=0,open=0,timer,utter,
hues=[36,168,268,340,200,96],round=0;
try{dn=new Intl.DisplayNames([de?"de":"en"],{type:"language"})}catch(e){}
try{best=+localStorage.best||0}catch(e){}
document.documentElement.lang=de?"de":"en";
q.textContent=T[0];
go.setAttribute("aria-label",de?"Los":"Play");
if(S)S.getVoices();

function name(l){var n;try{n=dn&&dn.of(l[0])}catch(e){}return n&&n!=l[0]?n:l[1]}
function voice(l){
  var vs=S?S.getVoices():[],pre=l[3].split(","),best,bs=-99;
  vs.forEach(function(v){
    var c=v.lang.replace("_","-").toLowerCase(),s=-99,i;
    for(i=0;i<pre.length;i++)if(c==pre[i]||c.indexOf(pre[i]+"-")==0){s=10-i*2;break}
    if(s<0)return;
    if(/premium|enhanced|natural|neural|siri/i.test(v.name))s+=5;
    else if(/google/i.test(v.name))s+=3;
    if(/eddy|flo\b|grand(ma|pa)|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|fred|good news|jester|junior|kathy|organ|superstar|ralph|trinoids|whisper|zarvox|compact/i.test(v.name))s-=8;
    if(s>bs){bs=s;best=v}
  });
  return best;
}
function shuffle(a){for(var i=a.length,j,t;i>1;){j=Math.random()*i--|0;t=a[i];a[i]=a[j];a[j]=t}return a}
function speak(){
  if(!S||!window.SpeechSynthesisUtterance)return;
  var v=voice(cur),busy=S.speaking||S.pending;
  if(!v&&S.getVoices().length)return;
  utter=new SpeechSynthesisUtterance(cur[4]);
  if(v)utter.voice=v;
  utter.lang=v?v.lang:cur[0];utter.rate=.85;
  S.cancel();
  busy?setTimeout(function(){S.speak(utter)},120):S.speak(utter);
}
function next(){
  clearTimeout(timer);
  // Play by ear where the device has enough voices; otherwise guess from the writing.
  var pool=S&&S.getVoices().length?L.filter(voice):L;if(pool.length<8)pool=L;
  if(!bag.length){bag=shuffle(pool.slice());if(bag.length>1&&bag[bag.length-1]==cur)bag.reverse()}
  cur=bag.pop();
  // Lookalikes first, and more of them the longer the streak runs.
  var near=shuffle(pool.filter(function(l){return l!=cur&&l[2]==cur[2]})).slice(0,1+streak/3|0),
      far=shuffle(pool.filter(function(l){return l!=cur&&near.indexOf(l)<0}));
  choices=shuffle([cur].concat(near,far).slice(0,4));
  for(var i=0;i<4;i++){B[i].className="";B[i].textContent=name(choices[i])}
  opts.className="";open=1;
  q.textContent=T[0];
  say.textContent=cur[4];say.lang=cur[0];
  say.setAttribute("aria-label",de?"Nochmal hören":"Hear it again");
  document.documentElement.style.setProperty("--h",hues[round++%hues.length]);
  show();speak();
}
function show(){
  score.textContent=T[4]+streak+" · "+T[5]+best;
}
function pick(i){
  if(!open){next();return}
  open=0;
  var ok=choices[i]==cur;
  B[choices.indexOf(cur)].className="y";
  if(!ok)B[i].className="n";
  opts.className="done";
  streak=ok?streak+1:0;
  if(streak>best){best=streak;try{localStorage.best=best}catch(e){}}
  q.textContent=T[1]+name(cur)+T[ok?2:3];
  show();
  timer=setTimeout(next,ok?1400:2600);
}
go.onclick=function(){
  go.hidden=1;say.hidden=opts.hidden=score.hidden=0;
  next();say.focus();
};
say.onclick=function(){open?speak():next()};
[0,1,2,3].forEach(function(i){B[i].onclick=function(){pick(i)}});
onkeydown=function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key.toLowerCase();
  if(!go.hidden&&(k=="enter"||k==" ")){e.preventDefault();go.onclick()}
  else if(go.hidden&&k>="1"&&k<="4")pick(k-1);
  else if(go.hidden&&k=="r")speak();
  else if(k=="d")open_("https://www.linkedin.com/in/dgeske/");
  else if(k=="s")open_("https://www.linkedin.com/in/stephanie-geske-7185014/");
};
function open_(u){window.open(u,"_blank","noopener,noreferrer")}
})();
</script>
</body>
</html>
