<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brew Dose">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a111d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Brew Dose</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<style>
/* Layout: on a phone, one column. An enamel-blue hero holds the glass and the three linked
   quantities; under it a swipeable scale ruler sets whichever one you know; tabs float at the
   bottom. From 720px the brew view splits into bench and guide; from 1100px it is a desktop
   workbench: methods rail, bench, guide, with the tabs in a top bar.
   System fonts only, so it works with no network. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #101c30;
  --muted: #5b6779;
  --line: #d5dbe4;
  --copper: #a9541f;
  --copper-soft: #f6e6d9;
  --on-copper: #ffffff;
  --hero: #16357c;
  --hero-ink: #ffffff;
  --hero-muted: #bccaea;
  --hero-accent: #ffc08c;
  --hero-line: #3f5cab;
  --hero-speck: #2a4a97;
  --brew-light: #9a5c2a;
  --brew-dark: #241208;
  --grounds: #0d0603;
  --crema: #dcc097;
  --good: #1f7a4d;
  --shadow: #101c3026;
  --font-display: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111d; --surface: #121b2b; --ink: #e9eef6; --muted: #93a1b5; --line: #26334a;
    --copper: #e79a5e; --copper-soft: #3a2416; --on-copper: #0a111d;
    --hero: #142a5e; --hero-ink: #ffffff; --hero-muted: #a9b9de; --hero-accent: #ffc08c;
    --hero-line: #34509a; --hero-speck: #1d3878;
    --brew-light: #9a5c2a; --brew-dark: #241208; --grounds: #0d0603; --crema: #dcc097; --good: #5fd39a; --shadow: #00000080;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111d; --surface: #121b2b; --ink: #e9eef6; --muted: #93a1b5; --line: #26334a;
  --copper: #e79a5e; --copper-soft: #3a2416; --on-copper: #0a111d;
  --hero: #142a5e; --hero-ink: #ffffff; --hero-muted: #a9b9de; --hero-accent: #ffc08c;
  --hero-line: #34509a; --hero-speck: #1d3878;
  --brew-light: #9a5c2a; --brew-dark: #241208; --grounds: #0d0603; --crema: #dcc097; --good: #5fd39a; --shadow: #00000080;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  padding-block: 14px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; min-height: 44px; }
button:focus-visible, input:focus-visible, .ruler:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; }
.view { display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* method strip */
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.strip::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 9px 15px; font-size: 15px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.about { margin: 0; font-size: 14.5px; color: var(--muted); }
.about b { color: var(--ink); font-weight: 600; }

/* hero */
.hero {
  background-color: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 18px;
  display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: stretch;
  background-image: radial-gradient(var(--hero-speck) 1.2px, transparent 1.6px), radial-gradient(var(--hero-speck) 0.9px, transparent 1.3px);
  background-size: 23px 19px, 17px 29px; background-position: 3px 5px, 11px 13px;
}
.glass {
  position: relative; border: 2px solid var(--hero-muted); border-top: 0; border-radius: 4px 4px 16px 16px;
  min-height: 176px; overflow: hidden; background: var(--hero);
}
.liquid { position: absolute; left: -8px; right: -8px; bottom: -24px; height: 24px; background: var(--brew-light); transition: height .45s var(--ease), background-color .35s ease; transform-origin: 50% 100%; transform: skewY(var(--tilt, 0deg)); background-image: linear-gradient(90deg, #ffffff24, transparent 34%, transparent 70%, #00000038); }
.grounds { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--grounds); transition: height .45s var(--ease); }
.glass::after { content: ""; position: absolute; top: 9%; bottom: 12%; left: 9%; width: 7%; border-radius: 9px; background: linear-gradient(#ffffff59, #ffffff14); pointer-events: none; }
.liquid::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--crema); }
.read .v em { display: block; font-style: normal; font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--hero-muted); line-height: 1.3; }
.cap { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--hero-muted); font-variant-numeric: tabular-nums; }
.reads { display: flex; flex-direction: column; justify-content: space-between; gap: 4px; min-width: 0; }
.read {
  display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 0;
  background: transparent; border: 0; border-bottom: 1px solid var(--hero-line); padding: 4px 0 8px; min-width: 0; color: var(--hero-ink);
}
.read:last-child { border-bottom: 0; padding-bottom: 0; }
.read .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--hero-muted); font-weight: 650; }
.read .v { font-family: var(--font-num); font-weight: 700; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.read .v small { font-size: 15px; font-weight: 600; color: var(--hero-muted); margin-left: 3px; }
.read[aria-pressed="true"] .v, .read[aria-pressed="true"] .k { color: var(--hero-accent); }
.read[aria-pressed="true"] .k::after { content: " · you set"; }

/* setter */
.setter { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 0 12px; display: flex; flex-direction: column; gap: 10px; }
.setter-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-inline: 14px; }
.typed { display: flex; align-items: center; gap: 6px; }
.nudge { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: 20px; line-height: 1; }
.setter-head .typed input { width: 78px; }
.typed input {
  width: 92px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
  font-family: var(--font-num); font-size: 20px; font-weight: 700; padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums;
}
.ruler-wrap { position: relative; }
.ruler-wrap::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 18px; width: 3px; margin-left: -1.5px; background: var(--copper); border-radius: 2px; pointer-events: none; }
.ruler { display: flex; cursor: grab; -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; }
.track i { position: absolute; top: 0; width: 1px; height: 1px; scroll-snap-align: center; }
.ruler::-webkit-scrollbar { display: none; }
.pad { flex: 0 0 50%; }
.track {
  flex: 0 0 auto; position: relative; height: 58px;
  background-image:
    linear-gradient(90deg, var(--ink) 0 2px, transparent 2px),
    linear-gradient(90deg, var(--muted) 0 1px, transparent 1px);
  background-size: 60px 30px, 12px 16px; background-repeat: repeat-x; background-position: 0 4px, 0 18px;
}
.track span { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-inline: 14px; }
.quick::-webkit-scrollbar { display: none; }
.q { flex: 1 0 auto; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 9px 12px; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* strength */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 13px; padding: 3px; background: var(--surface); }
.seg::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 10px; background: var(--ink); opacity: var(--on, 1); transform: translateX(calc(var(--i, 1) * 100%)); transition: transform .5s var(--spring), opacity .2s; }
.seg button { border: 0; background: transparent; padding: 9px 4px; font-size: 15px; z-index: 1; }
.seg button[aria-pressed="true"] { color: var(--bg); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; }
.ratio { font-family: var(--font-num); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; min-width: 62px; text-align: center; }
.block { display: flex; flex-direction: column; gap: 10px; }

/* timer + steps */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.go {
  border: 0; background: var(--copper); color: var(--on-copper); border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.go.running { background: var(--ink); color: var(--bg); font-family: var(--font-num); font-size: 30px; padding: 10px; }
.go.done { background: var(--good); color: var(--surface); }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--copper); transition: width .25s linear; }

.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; }

.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.fixout { font-size: 15px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.act { border: 1px solid var(--copper); color: var(--copper); background: transparent; border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 15px; }

/* explore */
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.way { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.way-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.way h3 { margin: 0; font-family: var(--font-display); font-size: 19px; }
.way p { margin: 0; font-size: 15px; }
.way .meta { font-size: 13px; color: var(--muted); }
.pill { font-family: var(--font-num); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--copper); white-space: nowrap; }
.way-actions { margin-top: auto; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tried { border: 1px dashed var(--muted); color: var(--muted); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
.tried[aria-pressed="true"] { border: 1px solid var(--good); color: var(--good); font-weight: 650; transform: rotate(-3deg); }

/* saved */
.saved-item { display: flex; gap: 10px; align-items: stretch; }
.saved-item .load { flex: 1; min-width: 0; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.saved-item .load b { font-family: var(--font-display); font-size: 17px; }
.saved-item .del { border: 1px solid var(--line); background: transparent; border-radius: 14px; padding: 0 12px; font-size: 14px; color: var(--muted); }
.gear-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.gear-row .who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.gear-row .who b { font-family: var(--font-display); font-size: 17px; }
.gear-row .typed input { width: 74px; font-size: 17px; }
.gear-row .del { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 10px; font-size: 14px; color: var(--muted); }
#gearName { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; padding: 8px 10px; }
.q.gear { border-color: var(--copper); color: var(--copper); font-weight: 600; }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 22px 16px; text-align: center; color: var(--muted); font-size: 15px; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  display: flex; justify-content: center;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tablist {
  position: relative; pointer-events: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: 100%; max-width: 340px; padding: 5px;
  border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 28px var(--shadow);
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(1.7); backdrop-filter: blur(20px) saturate(1.7);
}
.tab { border: 0; background: transparent; border-radius: 999px; padding: 8px 4px; font-size: 15px; color: var(--muted); z-index: 1; }
.tab[aria-selected="true"] { color: var(--copper); font-weight: 650; }
.ind { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 14px) / 3); border-radius: 999px; background: var(--copper-soft); transform: translateX(calc(var(--i, 0) * (100% + 2px))); transition: transform .5s var(--spring); }
.brand, .hint, .mname, .strip .grp { display: none; }
.rail, .bench, .guide, .cols { display: contents; }

/* ---------- feel: things answer the finger ---------- */
:root { --spring: cubic-bezier(.3, 1.45, .5, 1); --ease: cubic-bezier(.2, .8, .2, 1); }
@supports (transition-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1.004 83.8%, 1); }
}
html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
@media (display-mode: standalone) { html { touch-action: pan-x pan-y; } }
button { position: relative; transition: transform .5s var(--spring), background-color .18s, color .18s, border-color .18s, opacity .18s; }
button:active { transform: scale(.93); transition: transform .07s ease-out, background-color .18s, color .18s, border-color .18s; }
.read { transform-origin: 0 50%; }
.read:active, .go:active, .saved-item .load:active, .setrow:active { transform: scale(.975); }
.tried[aria-pressed="true"]:active { transform: scale(.93) rotate(-3deg); }
button:disabled { opacity: .8; }
.act.ok { background: var(--good); border-color: var(--good); color: var(--surface); }
.go.done { animation: pulse 1.1s ease-in-out 3; }
.tried.stamped { animation: stamp .45s cubic-bezier(.2, .9, .3, 1); }
.saved-item.gone { opacity: 0; transform: translateX(-24px); transition: opacity .2s, transform .2s ease-in; }
.fixout:not([hidden]) { animation: rise .3s var(--ease); }
.ruler.drag { cursor: grabbing; scroll-snap-type: none; }
@keyframes stamp { 0% { transform: scale(1.8) rotate(-14deg); opacity: 0; } 60% { transform: scale(.9) rotate(-3deg); opacity: 1; } 100% { transform: scale(1) rotate(-3deg); } }
@keyframes pulse { 50% { transform: scale(1.025); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* iPhone haptics: a real tap on a label wired to a native switch plays the system tick.
   The label covers the button; the switch itself stays out from under the finger. */
.hx { position: absolute; inset: 0; z-index: 2; margin: 0; border-radius: inherit; cursor: inherit; }
.hx input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; visibility: hidden; pointer-events: none; }

/* settings switch */
.setrow { width: 100%; text-align: left; }
.tog { flex: 0 0 auto; width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background-color .2s; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0000004d; transition: transform .45s var(--spring); }
.setrow[aria-checked="true"] .tog { background: var(--good); }
.setrow[aria-checked="true"] .tog::after { transform: translateX(20px); }

/* tab change: the page slides the way you went, the bar stays put */
.tabs { view-transition-name: tabs; }
::view-transition-old(root) { animation: .14s ease-in both vt-out; }
::view-transition-new(root) { animation: .3s var(--ease) both vt-in; }
@keyframes vt-out { to { opacity: 0; transform: translateX(calc(var(--dir, 1) * -16px)); } }
@keyframes vt-in { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 16px)); } }

@media (hover: hover) {
  .chip:hover, .q:hover, .nudge:hover, .stepper button:hover, .saved-item .load:hover, .del:hover { border-color: var(--muted); }
  .act:hover, .q.gear:hover { background: var(--copper-soft); }
  .act.ok:hover { background: var(--good); }
  .tab:hover, .seg button:hover { color: var(--ink); }
  .tab[aria-selected="true"]:hover { color: var(--copper); }
  .seg button[aria-pressed="true"]:hover { color: var(--bg); }
  .read:hover .k { color: var(--hero-ink); }
  .go:hover { filter: brightness(1.07); }
}

/* ---------- 720px and up: bench beside guide ---------- */
@media (min-width: 720px) {
  body { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-top: 22px; }
  .app { max-width: 980px; }
  #view-brew { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px 24px; align-items: start; }
  .top, .rail { grid-column: 1 / -1; }
  .rail { display: block; min-width: 0; }
  .strip { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }
  .bench, .guide { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .hero { grid-template-columns: 120px 1fr; padding: 22px; gap: 22px; }
  .glass { min-height: 220px; }
  .read .v { font-size: 40px; }
  .group { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .group > .label { grid-column: 1 / -1; }
  #ways { gap: 26px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
}

/* ---------- 1100px and up: desktop workbench ---------- */
@media (min-width: 1100px) {
  body { padding-top: 96px; padding-bottom: 56px; }
  .app { max-width: 1280px; }
  .tabs {
    top: 0; bottom: auto; pointer-events: auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(28px, calc(50vw - 640px)) 12px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
  }

    var d = e.target.closest('[data-gdel]');
    if (d) { after(function () { S.gear = S.gear.filter(function (g) { return String(g.id) !== d.dataset.gdel; }); save(); renderGear(); }); return; }
    if (e.target.closest('#gearAdd')) {
      var name = $('gearName').value.trim(), ml = parseFloat($('gearMl').value.replace(',', '.'));
      if (!name || !isFinite(ml) || ml <= 0) { $('gearName').focus(); return; }
      after(function () { S.gear.push({ id: Date.now(), name: name, method: S.method, ml: ml }); save(); renderGear(); });
    }
  });

  /* ---------- explore ---------- */
  function passport() {
    var n = ORDER.filter(function (k) { return S.tried[k]; }).length;
    $('passport').innerHTML = '<b>' + n + ' of ' + ORDER.length + ' tried.</b> Tap Tried to stamp the ones you have made.';
  }
  function renderExplore() {
    var groups = {};
    ORDER.forEach(function (k) { (groups[M[k].group] = groups[M[k].group] || []).push(k); });
    passport();
    $('ways').innerHTML = Object.keys(groups).map(function (g) {
      return '<div class="group"><span class="label">' + g + '</span>' + groups[g].map(function (k) {
        var m = M[k];
        return '<article class="way" id="way-' + k + '"><div class="way-top"><h3>' + m.name + '</h3><span class="pill">1:' + fmt(m.def, 1) + '</span></div>' +
          '<p>' + m.blurb + '</p><span class="meta">' + m.place + ' · ' + m.grind.toLowerCase() + ' · ' + (m.src ? 'ratio from a published recipe' : 'ratio is a rule of thumb') + '</span>' +
          '<div class="way-actions"><button class="act" type="button" data-brew="' + k + '">Brew this</button>' +
          '<button class="tried" type="button" data-tried="' + k + '" aria-pressed="' + Boolean(S.tried[k]) + '">' + (S.tried[k] ? 'Tried ✓' : 'Tried?') + '</button></div></article>';
      }).join('') + '</div>';
    }).join('');
  }
  $('ways').addEventListener('click', function (e) {
    var b = e.target.closest('[data-brew]'), t = e.target.closest('[data-tried]');
    if (b) { S.method = b.dataset.brew; save(); renderMethod(); show('brew'); }
    else if (t) {
      var on = S.tried[t.dataset.tried] = !S.tried[t.dataset.tried]; save(); passport();
      t.setAttribute('aria-pressed', String(on)); setText(t, on ? 'Tried ✓' : 'Tried?');
      t.classList.remove('stamped'); if (on) { void t.offsetWidth; t.classList.add('stamped'); }
    }
  });
  $('surprise').addEventListener('click', function () {
    var pool = ORDER.filter(function (k) { return !S.tried[k] && k !== S.method; });
    if (!pool.length) pool = ORDER.filter(function (k) { return k !== S.method; });
    S.method = pool[Math.floor(Math.random() * pool.length)]; save(); renderMethod(); show('brew');
  });

  /* ---------- tabs ---------- */
  var TABS = ['brew', 'explore', 'saved'], tabNow = 'brew';
  function show(tab) {
    if (tab === tabNow) { window.scrollTo({ top: 0, behavior: STILL ? 'auto' : 'smooth' }); return; }
    document.documentElement.style.setProperty('--dir', TABS.indexOf(tab) > TABS.indexOf(tabNow) ? 1 : -1);
    tabNow = tab;
    document.querySelector('.tablist').style.setProperty('--i', TABS.indexOf(tab));
    all('.tab', function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    if (document.startViewTransition && !STILL) document.startViewTransition(function () { swap(tab); });
    else swap(tab);
  }
  function swap(tab) {
    TABS.forEach(function (t) { $('view-' + t).hidden = t !== tab; });
    window.scrollTo(0, 0);
    if (tab === 'brew') render('full');
    if (tab === 'saved') renderGear();
  }
  all('.tab', function (b) { b.addEventListener('click', function () { show(b.dataset.tab); }); });

  var soundBtn = $('soundBtn');
  function paintSound() { soundBtn.setAttribute('aria-checked', String(S.sound)); }
  soundBtn.addEventListener('click', function () { S.sound = !S.sound; save(); paintSound(); if (S.sound) { unlock(true); tickSound(true); } });
  paintSound();

  renderMethod(true); renderExplore(); renderSaved(); hx(document);
  window.addEventListener('load', function () { setRuler(false); });

  if (document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator) {
    try {
      /* A new version takes over on its own: reload once when the new worker claims the page,
         unless a timer is running. */
      var had = !!navigator.serviceWorker.controller, swapped = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!had || swapped || tick) return;
        swapped = true; location.reload();
      });
      navigator.serviceWorker.register('sw.js').catch(function () {});
    } catch (e) {}
  }
})();
</script>

</body></html>
